<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <title>FindMyCandy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div id="crt">
        <div id="screen">
            <div id="wrapper">
                <div id="interlace"></div>
                <div id="scanline"></div>
                <div id="envelope">
                    <div class="container">
                        <div class="content-wrapper">
                            <img src="assets/title.svg" alt="FINDMYCANDY" class="title-svg">
                            <div class="search-container">
                                <div class="search-wrapper">
                                    <input type="text" id="searchInput" placeholder=">_" autocomplete="off">
                                    <div class="search-row">
                                        <div class="dropdown-wrapper">
                                            <div class="custom-dropdown" id="filterDropdown">
                                                <div class="selected-option">All Files</div>
                                                <div class="dropdown-arrow"></div>
                                                <div class="options-list">
                                                    <div class="option selected" data-value="all">All Files</div>
                                                    <div class="option" data-value="video">Movies & Videos</div>
                                                    <div class="option" data-value="audio">Music & Audio</div>
                                                    <div class="option" data-value="document">Books & Documents</div>
                                                    <div class="option" data-value="software">Software & Apps</div>
                                                </div>
                                            </div>
                                        </div>
                                        <button class="search-btn">Search</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="footer">
                        <div class="message-carousel"></div>
                        <a href="https://github.com/yashthorat7" target="_blank" class="github-link">
                            <img src="assets/github.svg" alt="GitHub" width="24" height="24">
                            <span>yashthorat7</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="scripts/main.js"></script>
</body>

</html>
